name: MacBridge
options:
  bundleIdPrefix: com.habibtalib
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  BridgeCore:
    path: Packages/BridgeCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Screen Recording and Accessibility grants are tied to the code signature,
    # so builds must be signed with a stable identity, never ad hoc.
    DEVELOPMENT_TEAM: 66G227SMR5
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
targets:
  MacBridge:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: BridgeCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MacBridge
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The signaling server may be a plain ws:// address on a private
        # network (Tailscale, LAN); the local-networking exception does not
        # cover Tailscale's 100.x addresses. Sessions do not depend on TLS:
        # setup messages are signed end to end. Over the open internet still
        # use wss://, or the access token is sent in the clear.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.habibtalib.macbridge
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ARCHS: arm64
schemes:
  MacBridge:
    build:
      targets:
        MacBridge: all
    run:
      config: Debug
