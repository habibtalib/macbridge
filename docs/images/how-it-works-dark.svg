<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="900" height="400" rx="16" fill="#0d1117"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8d96a0"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c93ff"/></marker></defs>
<!-- server -->
<rect x="330" y="28" width="240" height="92" rx="12" fill="#161b22" stroke="#30363d"/>
<text x="450" y="62" text-anchor="middle" font-size="17" font-weight="600" fill="#e6edf3">Signaling server</text>
<text x="450" y="84" text-anchor="middle" font-size="13" fill="#8d96a0">self-hosted · Node · access token</text>
<text x="450" y="104" text-anchor="middle" font-size="13" fill="#8d96a0">+ optional TURN relay</text>
<!-- macs -->
<g><rect x="40" y="200" width="230" height="130" rx="12" fill="#161b22" stroke="#30363d"/>
<rect x="95" y="222" width="120" height="70" rx="6" fill="none" stroke="#e6edf3" stroke-width="2.5"/><path d="M80 300h150" stroke="#e6edf3" stroke-width="2.5" stroke-linecap="round"/>
<text x="155" y="320" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Your Mac · controller</text></g>
<g><rect x="630" y="200" width="230" height="130" rx="12" fill="#161b22" stroke="#30363d"/>
<rect x="685" y="222" width="120" height="70" rx="6" fill="none" stroke="#e6edf3" stroke-width="2.5"/><path d="M670 300h150" stroke="#e6edf3" stroke-width="2.5" stroke-linecap="round"/>
<text x="745" y="320" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Other Mac · controlled</text></g>
<!-- setup lines -->
<path d="M200 196 L345 124" stroke="#8d96a0" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M700 196 L555 124" stroke="#8d96a0" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="40" y="150" font-size="12.5" fill="#8d96a0">1 · key login, pairing, signed offer</text>
<text x="860" y="150" text-anchor="end" font-size="12.5" fill="#8d96a0">2 · signed answer</text>
<!-- p2p -->
<path d="M276 262 L624 262" stroke="#7c93ff" stroke-width="4" fill="none" marker-end="url(#b)" marker-start="url(#b)"/>
<text x="450" y="248" text-anchor="middle" font-size="14" font-weight="600" fill="#7c93ff">3 · direct WebRTC, peer-to-peer</text>
<text x="450" y="284" text-anchor="middle" font-size="12.5" fill="#e6edf3">screen (H.264) ← · → mouse, keyboard, clipboard</text>
<text x="450" y="358" text-anchor="middle" font-size="12.5" fill="#3fb950">fingerprints signed by both Macs: the server can't read, alter or start a session</text>
<text x="450" y="382" text-anchor="middle" font-size="12" fill="#8d96a0">iPhone and iPad connect the same way as a controller</text>
</svg>